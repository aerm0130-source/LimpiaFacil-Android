
name: Crear APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descomprimir proyecto
        run: |
          unzip -q LimpiaFacil_GitHub_Autocompila.zip -d proyecto
          ls -la proyecto

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android
        uses: android-actions/setup-android@v3

      - name: Instalar SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        working-directory: proyecto
        run: gradle --no-daemon :app:assembleDebug

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: LimpiaFacil-APK
          path: proyecto/app/build/outputs/apk/debug/app-debug.apk
